name: ClimateRAG CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit and integration tests
      run: |
        python -m pytest tests/ -v
        
    - name: Run RAGAS eval gate simulation
      run: |
        # Run eval.py to generate eval dataset and run local metrics
        # Mock retrieval and check that validation setup functions correctly
        python -m src.backend.eval
