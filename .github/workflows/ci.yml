name: NyayBot CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit and integration tests
      run: |
        python -m pytest tests/ -v
        
    - name: Run RAGAS eval gate simulation
      # Only runs when GEMINI_API_KEY or GROQ_API_KEY secret is configured in repo.
      # Skip silently in bare CI runners — no GPU, no model cache, no HuggingFace indexes.
      if: ${{ secrets.GEMINI_API_KEY != '' || secrets.GROQ_API_KEY != '' }}
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python eval/run_eval_gate.py
