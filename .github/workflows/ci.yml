name: NyayBot CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Audit Python dependencies (OWASP A06)
      # Surface known CVEs in the Python dep tree. continue-on-error so a
      # finding doesn't block deploy, but remains visible in Actions output.
      continue-on-error: true
      run: |
        pip install pip-audit
        pip-audit -r requirements.txt

    - name: Audit npm dependencies (OWASP A06)
      # Only flag high-severity or above to avoid noise from low-risk advisories.
      continue-on-error: true
      working-directory: frontend
      run: npm audit --audit-level=high

    - name: Run unit and integration tests
      run: |
        python -m pytest tests/ -v

    - name: Run RAGAS eval gate simulation
      # Only runs when GEMINI_API_KEY or GROQ_API_KEY secret is configured in repo.
      # Skip silently in bare CI runners — no GPU, no model cache, no HuggingFace indexes.
      # continue-on-error prevents CI going red if the gate fails for non-code reasons
      # (e.g. missing secrets in fork PRs where secrets are unavailable by design).
      if: env.GEMINI_API_KEY != '' || env.GROQ_API_KEY != ''
      continue-on-error: true
      run: |
        python eval/run_eval_gate.py

